name: Build Life APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Life project
        run: |
          unzip -o Life_Android_Project_A_S_A.zip -d source
          PROJECT_DIR=$(find source -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix JVM target
        run: |
          find "$PROJECT_DIR" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            sed -i 's/VERSION_1_8/VERSION_17/g' "$file"
            sed -i "s/jvmTarget = ['\"]1.8['\"]/jvmTarget = '17'/g" "$file"
            sed -i 's/jvmTarget = ['\"]8['\"]/jvmTarget = '\''17'\''/g' "$file"
          done

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Life-APK
          path: |
            **/build/outputs/apk/debug/*.apk
